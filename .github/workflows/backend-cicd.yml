name: "CI: Build and Deploy to Production"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-production:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE_BASE: ${{ secrets.ACR_HOST }}/${{ secrets.ACR_REPOSITORY }}

    steps:
      - name: Checkout to the Tag
        uses: actions/checkout@v5

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Docker Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_HOST }} -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build and Push Docker Image
        id: build
        run: |
          VERSION_TAG="${GITHUB_REF_NAME}"
          IMAGE_NAME="$IMAGE_BASE:$VERSION_TAG"
          docker build -f ./backend/Dockerfile -t "$IMAGE_NAME" ./backend/
          docker push "$IMAGE_NAME"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-production
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Production Label
        env:
          IMAGE_NAME: ${{ secrets.ACR_HOST }}/${{ secrets.ACR_REPOSITORY }}:${{ github.ref_name }}
        run: |
          az containerapp update \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_CONTAINER_APP_RESOURCE_GROUP_NAME }} \
            --image "$IMAGE_NAME" \

      - name: Deployment Summary
        if: always()
        run: |
          {
            echo "## Production Deployment Complete"
            echo
            echo "**Release Tag**: \`${GITHUB_REF_NAME}\`"
            echo
            echo "**Image**: \`${{ needs.build-production.outputs.image_name }}\`"
            echo
            echo "**Deployment Label**: \`production\`"
            echo
            echo "**Container App**: \`${{ vars.AZURE_CONTAINER_APP_NAME }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
